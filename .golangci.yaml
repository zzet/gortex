# golangci-lint configuration (schema v2).
# CI pins golangci-lint to v2.13.1 (.github/workflows/ci.yml).
version: "2"

linters:
  # Keep the same set CI already enforced before this file existed:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

  enable:
    # sql.Rows.Close reports the driver's close error, not the iteration
    # error (rs.lasterr), so a scan that fails part-way through looks like a
    # scan that ended. The result is an empty or short result set returned
    # with a nil error — a wrong answer, not a failure. errcheck cannot see
    # this because Close IS checked at these sites; only the Err call is
    # missing. Every such site found when this was enabled was a silent
    # truncation, so the class is worth a linter rather than review vigilance.
    - rowserrcheck

  settings:
    errcheck:
      # Unchecked errors on the fmt print family are noise, not bugs: these
      # return (n int, err error) whose error is virtually never actionable.
      # Listed explicitly so the intent is obvious at the call site review;
      # the std-error-handling preset below also covers them via regex.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bufio.Writer).Flush
        - (io.Closer).Close

  exclusions:
    # `lax` skips obviously generated files; we keep it explicit.
    generated: lax
    rules:
      # internal/thirdparty/fswatcher declares one watcher struct that is
      # shared across platform-specific files. The handle and streamMu fields
      # and the scanDirectory method are used only by the Darwin, Windows and
      # BSD builds; the Linux `unused` pass compiles just the Linux files and
      # cannot see those uses, so it reports them as dead. A struct cannot be
      # split across files, so this is a single-GOOS blind spot, not real dead
      # code. Scope the exemption to the `unused` linter and this path so every
      # other linter still covers the package.
      - path: internal/thirdparty/fswatcher/
        linters:
          - unused
    presets:
      # Drops the well-known stdlib error-handling false positives that
      # errcheck flags: the fmt print family, (*T).Close / .Flush,
      # os.Remove(All), os.Setenv / os.Unsetenv, and writes to
      # os.Stdout / os.Stderr.
      - std-error-handling
