version: 2

# Run inside ghcr.io/goreleaser/goreleaser-cross — the Docker image ships
# cross-compile toolchains so CGO (tree-sitter) links cleanly on a single
# Linux runner. This config builds the LINUX targets + their deb/rpm/apk
# packages, the checksums, and the GitHub release. darwin and windows are
# built on NATIVE runners in release.yml (the build-darwin / release-windows
# jobs) because their toolchains can't be cross-faked safely:
#   - darwin: the osxcross ld64 in this image omits the __DATA_CONST
#     SG_READ_ONLY flag that macOS 15+/Tahoe dyld enforces (issue #176), so
#     darwin must link with Apple's ld on a macOS runner. The homebrew cask
#     (which references all four os/arch tarballs) is assembled and pushed by
#     release.yml once the darwin hashes exist — it is NOT generated here.
#   - windows: the CGo tree-sitter bindings need a real mingw C/C++ toolchain.
before:
  hooks: []
    # No before hooks, for the same reason in both cases: the tag is already
    # on a green commit, so re-running work here costs tag-to-artifact time
    # without catching anything new.
    #
    # Tests run in CI on every push, so `go test ./...` inside
    # goreleaser-cross adds nothing.
    #
    # `go mod tidy` was worse than redundant. It walks the full module graph
    # including the test dependencies of dependencies, so it spent ~5 minutes
    # on the network and took v0.63.8 down when proxy.golang.org returned
    # HTTP/2 INTERNAL_ERROR on six unrelated fetches. And because it MUTATES
    # go.mod/go.sum in the container, a drifted module set would be silently
    # rewritten at release time and the shipped binaries built against
    # something no CI job had ever compiled. Tidiness is now asserted in the
    # `lint` job of ci.yml, where drift fails the PR instead.

builds:
  - id: main
    main: ./cmd/gortex/
    binary: gortex
    # A statically linked glibc cannot dlopen anything on a host whose glibc
    # differs from the build host's — and it does not fail cleanly, it SEGVs
    # inside the loader. These three tags remove every dlopen from the binary:
    #   netgo      — resolver reads /etc/resolv.conf instead of getaddrinfo
    #   osusergo   — user lookup reads /etc/passwd instead of getpwuid
    #   static_link — custom tree-sitter grammars decline up front instead of
    #                 crashing the daemon (internal/parser/languages)
    # Without them -static would produce a binary that starts everywhere and
    # then dies on first use.
    tags:
      - netgo
      - osusergo
      - static_link
    ldflags:
      # main.version + main.commit get parsed at startup into a SemVer 2.0.0
      # Version (see internal/version). Commit lands in the +build slot so
      # `gortex version` output round-trips as canonical semver.
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
      # Link the C/C++ runtime in, the same way release.yml does for the
      # windows .exe. The C++ stdlib is in the link at all because some
      # tree-sitter grammars carry C++ external scanners; linking it
      # dynamically stamped the binary with the goreleaser-cross image's
      # GLIBCXX/GLIBC floor (Ubuntu 24.04, GCC 13.3 -> GLIBCXX_3.4.32 +
      # GLIBC_2.34), so it refused to start on any older distro:
      #
      #   gortex: /lib/x86_64-linux-gnu/libstdc++.so.6:
      #           version `GLIBCXX_3.4.32' not found (required by gortex)
      #
      # Debian 12 and Ubuntu 22.04 top out at GLIBCXX_3.4.30/3.4.29, so the
      # dynamic build only ran on Ubuntu 24.04+/Debian 13+. Static linking
      # removes the floor entirely and makes the README's "single static
      # binary, no dependency chain" claim true on linux. The
      # "Verify linux binaries are self-contained" step in release.yml is the
      # gate that keeps it that way.
      - -extldflags "-static"
    env:
      - CGO_ENABLED=1
    hooks:
      # Run per built binary, before anything is archived or published, so a
      # link that quietly went dynamic again aborts the release instead of
      # shipping. `goreleaser release` creates the GitHub release as part of
      # the same run, so this has to be a build hook — a workflow step after
      # it would only ever be a post-mortem.
      post:
        - cmd: sh scripts/verify-static-elf.sh "{{ .Path }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # Per-target CC + CXX. goreleaser-cross exposes these cross-toolchains
    # on PATH; CGO needs both set per target triple because some deps
    # (tree-sitter yaml scanner, etc.) ship C++. Without CXX, the system
    # default x86_64-linux-gnu-g++ leaks in.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++

archives:
  - formats: [tar.gz]
    # Windows users expect a .zip, not a .tar.gz — and Scoop only
    # understands zip archives.
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version intentionally omitted — `/releases/latest/download/<name>` URLs
    # require an exact filename, and users linking to the latest release
    # shouldn't need to know the version. Version is still in the release
    # tag and in `gortex version`.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

nfpms:
  - id: gortex
    # Match the archive naming — version omitted so `/releases/latest/download`
    # URLs work without templating. Package metadata still carries the version.
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - main
    formats:
      - deb
      - rpm
      - apk
    vendor: "zzet"
    homepage: "https://github.com/zzet/gortex"
    maintainer: "zzet"
    description: "Code intelligence engine that indexes repositories into a knowledge graph."
    license: "Custom"

# NOTE: the homebrew cask is NOT generated here. goreleaser's `homebrew_casks`
# can only reference archives goreleaser itself built, but darwin is now built
# on a native macOS runner (issue #176) and the cask references all four
# os/arch tarballs (incl. darwin). So the cask is assembled and pushed to
# zzet/homebrew-tap by the "Publish homebrew cask" step in release.yml, once
# every platform's tarball + sha256 exists. The cask is still install-time
# completion-generated (`generate_completions_from_executable`, run on the
# user's machine), so no binary needs to run at release time to build it.
#
# NOTE: goreleaser also does NOT generate the Scoop manifest — windows is built
# by the separate `release-windows` job (native runner) and isn't an artifact
# of this goreleaser-cross run. That job publishes the manifest to
# gortexhq/scoop-bucket itself (see its "Publish Scoop manifest" step).
