name: Windows fixture contract qualification

on:
  push:
    branches: [codex/windows-fixture-contract-qualification-20261004]

permissions:
  contents: read

jobs:
  full-store-0-qualification:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record candidate source
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain --untracked-files=normal
          go version
      - name: Build as required CI
        run: go build -o gortex ./cmd/gortex/
      - name: Run exact required Windows store-0 shard
        shell: bash
        env:
          TEST_PARTITION: store-0
          TEST_WINDOWS: true
        run: python scripts/ci-test-partition.py
      - name: Verify compiled affected-family coverage
        id: affected
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          path=Path("test-selection.json")
          m=json.loads(path.read_text())
          assert m["partition"]=="store-0"
          required={"TestBulkCompletionConvergesUnmeasuredTailBeforeWriterCredit","TestCompletedSlowConvergenceRecoversContinuousWrites","TestSlowConvergenceProofRefusesInvalidCopies"}
          assert required <= set(m["census"]), "affected family missing from compiled census"
          selected=set(m["shards"][0]); missing=sorted(required-selected)
          print("COMPILED_AFFECTED_SELECTION",json.dumps({"census_count":len(m["census"]),"selected_count":len(selected),"in_store0":sorted(required & selected),"missing":missing,"manifest_sha256":hashlib.sha256(path.read_bytes()).hexdigest()}))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("missing="+str(bool(missing)).lower()+"\n")
          PYCODE
      - name: Qualify affected families if candidate census moved them
        if: ${{ always() && steps.affected.outputs.missing == 'true' }}
        shell: bash
        run: go test -v -count=1 -timeout=45m -run '^(TestBulkCompletionConvergesUnmeasuredTailBeforeWriterCredit|TestCompletedSlowConvergenceRecoversContinuousWrites|TestSlowConvergenceProofRefusesInvalidCopies)$' ./internal/graph/store_sqlite
