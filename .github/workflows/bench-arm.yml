name: Explicit Performance and Acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit flow to run (native acceptance starts private daemons)
        type: choice
        default: benchmarks
        options:
          - release-size-proof
          - benchmarks
          - performance
          - acceptance-helpers
          - acceptance-native
          - acceptance-native-windows

permissions:
  contents: read

jobs:
  bench-arm64:
    if: inputs.suite == 'benchmarks'
    name: Benchmark (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -count=3 -benchtime=2s -timeout=20m \
            -run='^$' \
            ./internal/graph/ \
            ./internal/search/ \
            ./internal/parser/languages/ \
            ./internal/resolver/ \
            ./internal/query/ \
            ./internal/indexer/ \
            ./internal/analysis/ \
            | tee bench-arm64.txt

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-arm64-${{ github.sha }}
          path: bench-arm64.txt
          retention-days: 90

      - name: Compare with main (PR only)
        if: github.event_name == 'pull_request'
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260409210113-8e83ce0f7b1c
          # Download baseline from main branch artifact if available
          echo "Benchmark results uploaded. Compare manually with benchstat."

  bench-amd64:
    if: inputs.suite == 'benchmarks'
    name: Benchmark (AMD64 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -count=3 -benchtime=2s -timeout=20m \
            -run='^$' \
            ./internal/graph/ \
            ./internal/search/ \
            ./internal/parser/languages/ \
            ./internal/resolver/ \
            ./internal/query/ \
            ./internal/indexer/ \
            ./internal/analysis/ \
            | tee bench-amd64.txt

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-amd64-${{ github.sha }}
          path: bench-amd64.txt
          retention-days: 90

  performance:
    if: inputs.suite == 'performance'
    name: Tagged performance measurements
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run explicit measurements (external-corpus flows remain opt-in)
        run: go test -tags performance -run '^TestPerformance' -count=1 -timeout=50m -v ./...

      - name: Run route-edit contract benchmark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gortex-performance-artifacts"
          go test -tags performance -run '^$' -bench '^BenchmarkContractDeltaJobRouteEdit$' \
            -benchtime=10x -count=3 -timeout=15m ./internal/indexer \
            | tee "$RUNNER_TEMP/gortex-performance-artifacts/contract-route-edit.txt"
      - name: Upload route-edit benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-route-edit-${{ github.sha }}
          path: ${{ runner.temp }}/gortex-performance-artifacts
          retention-days: 90

  acceptance-helpers:
    if: inputs.suite == 'acceptance-helpers'
    name: Acceptance harness self-tests (no native acceptance claim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check helpers with native driver gates unset
        run: go test -tags acceptance -run '^Test(SustainedIO|E2EMatrix|Issue767)' -count=1 -timeout=20m -v ./cmd/gortex

  acceptance-native:
    if: inputs.suite == 'acceptance-native'
    name: Native acceptance on owned temporary fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build candidate daemon
        run: go build -o "$RUNNER_TEMP/gortex-acceptance" ./cmd/gortex
      - name: Run native drivers with explicit binary gates
        env:
          GX_E2E_MATRIX_BINARY: ${{ runner.temp }}/gortex-acceptance
          GX_SUSTAINED_IO_TEST_BINARY: ${{ runner.temp }}/gortex-acceptance
          GORTEX_ISSUE767_TEST_BINARY: ${{ runner.temp }}/gortex-acceptance
          GORTEX_ISSUE767_READINESS_BINARY: ${{ runner.temp }}/gortex-acceptance
          GX_E2E_MATRIX_ARTIFACT_DIR: ${{ runner.temp }}/gortex-acceptance-artifacts/matrix
          GX_SUSTAINED_IO_ARTIFACT_DIR: ${{ runner.temp }}/gortex-acceptance-artifacts/sustained-io
          GORTEX_ISSUE767_ARTIFACT_DIR: ${{ runner.temp }}/gortex-acceptance-artifacts/fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gortex-acceptance-artifacts"
          go test -tags acceptance -count=1 -timeout=170m -v ./cmd/gortex \
          -run '^Test(E2EMatrixNoopFamily|E2EMatrixEditTaxonomy|E2EMatrixResolutionProvenanceManifests|E2EMatrix4ViewLifecycle|E2EMatrix5MainAdvanceWithTenDependents|E2EMatrix6Lifecycle|E2EMatrix7Adversarial|SustainedIOSustainedWriteAmplification|Issue767IdleIOIntegration|Issue767WorktreeReadinessIntegration|E2EMatrixContractLifecycle|ContractCapacityTwoFourActorsMCPRetryAndSuccess)$' \
            | tee "$RUNNER_TEMP/gortex-acceptance-artifacts/test-output.txt"

      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-native-${{ github.sha }}
          path: ${{ runner.temp }}/gortex-acceptance-artifacts
          retention-days: 90

  acceptance-native-windows:
    if: inputs.suite == 'acceptance-native-windows'
    name: Native Windows worktree restart edits (10 repetitions)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      CGO_CFLAGS: -O2 -g -fno-strict-aliasing
      CGO_CXXFLAGS: -O2 -g -fno-strict-aliasing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/gortex-windows-readiness-artifacts"
      - name: Build native Windows candidate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/gortex-acceptance.exe" ./cmd/gortex 2>&1 \
            | tee "$RUNNER_TEMP/gortex-windows-readiness-artifacts/build-output.txt"
          go version -m "$RUNNER_TEMP/gortex-acceptance.exe" \
            > "$RUNNER_TEMP/gortex-windows-readiness-artifacts/build-info.txt"
          sha256sum "$RUNNER_TEMP/gortex-acceptance.exe" \
            > "$RUNNER_TEMP/gortex-windows-readiness-artifacts/binary-sha256.txt"
      - name: Run native restart edits ten times (same-drive and available cross-drive)
        timeout-minutes: 35
        env:
          GORTEX_ISSUE767_READINESS_BINARY: ${{ runner.temp }}/gortex-acceptance.exe
          GORTEX_ISSUE767_ARTIFACT_DIR: ${{ runner.temp }}/gortex-windows-readiness-artifacts/fixtures
        run: |
          set -euo pipefail
          go test -tags acceptance -count=10 -timeout=30m -v \
            -run '^TestIssue767WorktreeReadinessIntegration$' ./cmd/gortex 2>&1 \
            | tee "$RUNNER_TEMP/gortex-windows-readiness-artifacts/test-output.txt"
      - name: Upload Windows restart evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-native-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gortex-windows-readiness-artifacts
          retention-days: 90


  release-size-build:
    if: inputs.suite == 'release-size-proof'
    name: Release size (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            source: bed4c788445710f79f1c6d8218e41b5d5fa8637c
            tree: 719e2a13213522c02c5fd33b7455017fd183c7b2
          - label: control
            source: a6573abafc416ab008120e3820b4eda182e347bf
            tree: d0f619d85e3c6286ae8784b90b958bfe6b8597c5
    env:
      SOURCE_SHA: ${{ matrix.source }}
      # Common fixed, equal-length metadata for attribution. This is a
      # prospective release-shape build, never an official release artifact.
      SOURCE_VERSION: 0.64.12
      SOURCE_DATE: '2026-11-01T00:00:00Z'
    steps:
      - name: Check out dispatch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Check out exact measurement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git -C source status --porcelain)"
          git -C source merge-base --is-ancestor a6573abafc416ab008120e3820b4eda182e347bf "$SOURCE_SHA"
      - name: Build both Linux architectures in exact release image
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          bash control/scripts/size-proof-driver.sh source "$RUNNER_TEMP/proof/$LABEL" control
      - name: Retain binaries, logs and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-size-${{ matrix.label }}
          path: ${{ runner.temp }}/proof/${{ matrix.label }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

  release-size-compare:
    if: always() && inputs.suite == 'release-size-proof'
    needs: release-size-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch candidate measurement artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-size-candidate
          path: ${{ runner.temp }}/proof/candidate
      - name: Fetch matched parent measurement artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-size-control
          path: ${{ runner.temp }}/proof/control
      - name: Fetch fixed published baseline archives and checksums
        if: needs.release-size-build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof/baseline"
          gh api repos/zzet/gortex/releases/tags/v0.64.10 > "$RUNNER_TEMP/proof/baseline/release.json"
          gh release download v0.64.10 --repo zzet/gortex             --pattern checksums.txt --pattern gortex_linux_amd64.tar.gz             --pattern gortex_linux_arm64.tar.gz --dir "$RUNNER_TEMP/proof/baseline"
      - name: Evaluate original two percent size gate
        if: needs.release-size-build.result == 'success'
        run: |
          set -euo pipefail
          printf 'workflow_source=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/proof/compare-provenance.txt"
          sha256sum scripts/size-proof-compare.py .github/workflows/bench-arm.yml >> "$RUNNER_TEMP/proof/compare-provenance.txt"
          python3 scripts/size-proof-compare.py "$RUNNER_TEMP/proof"
      - name: Publish measurement summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/proof/size-report.md"; then
            cat "$RUNNER_TEMP/proof/size-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Size proof incomplete: inspect retained build/fetch evidence. No acceptance credit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain full comparison and published baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-size-comparison
          path: |
            ${{ runner.temp }}/proof/size-report.json
            ${{ runner.temp }}/proof/size-report.md
            ${{ runner.temp }}/proof/compare-provenance.txt
            ${{ runner.temp }}/proof/baseline
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
      - name: Require both source builds
        if: needs.release-size-build.result != 'success'
        run: exit 1
