name: Performance readiness and gates

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Measurements are independent of ci.yml and never borrow its test matrix.
# Do not cancel an older measurement: every owned daemon must retain stop receipts.
concurrency:
  group: perf-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '1'
  CGO_CFLAGS: -O2 -g -fno-strict-aliasing
  CGO_CXXFLAGS: -O2 -g -fno-strict-aliasing
  GOTOOLCHAIN: local

jobs:
  readiness:
    name: Performance readiness (not acceptance)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A green readiness job is not a passed performance gate. The JSON/summary
      # names every unavailable observation; plan exits nonzero while gaps exist.
      - name: Declare smoke prerequisites (not a measured smoke lane)
        continue-on-error: true
        run: go run ./bench/check-budgets plan --lane smoke --host-class hosted_arm_smoke --out smoke-readiness.json
      - name: Declare nightly prerequisites (does not start the five-night calendar)
        continue-on-error: true
        run: go run ./bench/check-budgets plan --lane nightly --out nightly-readiness.json
      - name: Declare release prerequisites
        continue-on-error: true
        run: go run ./bench/check-budgets plan --lane release --out release-readiness.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-readiness-${{ github.run_id }}
          path: '*-readiness.json'
          retention-days: 90
          if-no-files-found: error

  smoke:
    name: PR performance measurement (report-only)
    if: github.event_name == 'pull_request' && vars.PERF_PR_SMOKE_ENABLED == 'true'
    # Keep the checker strict and retain failed evidence without failing a PR.
    # Job scope also covers preparation, retrieval and artifact-upload failures.
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    # Complete-run measurement bound: <=120m, plus <=2m owned cleanup.
    # Setup steps total <=20m and always-upload has <=3m. The 15m full-job
    # p95 target is deferred; this operational bound is NOT a new target.
    timeout-minutes: 145
    permissions:
      contents: read
      actions: read
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - timeout-minutes: 5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build clean candidate and owned measurement commands
        timeout-minutes: 5
        run: |
          go build -buildvcs=true -o "${{ runner.temp }}/perf-candidate" ./cmd/gortex
          go build -buildvcs=true -o "${{ runner.temp }}/perf-load" ./bench/load
          go build -buildvcs=true -o "${{ runner.temp }}/perf-check-budgets" ./bench/check-budgets
      - name: Retrieve the exact main pinned at PR planning time
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_MAIN_REVISION: ${{ github.event.pull_request.base.sha }}
        run: >-
          "${{ runner.temp }}/perf-check-budgets" fetch-main
          --main-revision "$PERF_MAIN_REVISION"
          --out "${{ runner.temp }}/perf-main"
      - name: Prepare the reviewed contemporary fixture
        timeout-minutes: 2
        run: >-
          "${{ runner.temp }}/perf-check-budgets" prepare-fixture
          --revision c6c6de19da02fc698db7a89f9922a8ec49cc61b5
          --out "${{ runner.temp }}/perf-fixture"
      - name: Compile all three clean candidate benchmark executables
        timeout-minutes: 4
        run: >-
          "${{ runner.temp }}/perf-check-budgets" prepare-tests
          --source . --revision "${{ github.sha }}"
          --out "${{ runner.temp }}/perf-candidate-tests"
      - name: Run five standalone steps and same-job microbenchmark comparison
        timeout-minutes: 122
        # Resolve the tool caches prepared by this job before private daemons
        # isolate HOME. Graph stores remain fresh and owned by their build.
        run: |
          env GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            "${{ runner.temp }}/perf-check-budgets" smoke \
            --candidate-binary "${{ runner.temp }}/perf-candidate" \
            --load-binary "${{ runner.temp }}/perf-load" \
            --main-bundle "${{ runner.temp }}/perf-main" \
            --candidate-builds "${{ runner.temp }}/perf-candidate-tests" \
            --fixture "${{ runner.temp }}/perf-fixture" \
            --offer 20s \
            --out "${{ runner.temp }}/perf-smoke-evidence"
      - name: Preserve attempted smoke reports and failures
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf-smoke-evidence/*.json
            ${{ runner.temp }}/perf-smoke-evidence/workload/*.json
            ${{ runner.temp }}/perf-smoke-evidence/workload/*.txt
            ${{ runner.temp }}/perf-smoke-evidence/workload/*.log
            ${{ runner.temp }}/perf-smoke-evidence/workload/runs/sequence.json
            ${{ runner.temp }}/perf-smoke-evidence/workload/runs/*/report.json
            ${{ runner.temp }}/perf-smoke-evidence/workload/runs/*/logs/
            ${{ runner.temp }}/perf-smoke-evidence/microbench/*.json
            ${{ runner.temp }}/perf-smoke-evidence/microbench/*.txt
            ${{ runner.temp }}/perf-smoke-evidence/microbench/*/*.txt
            ${{ runner.temp }}/perf-fixture/fixture.json
            ${{ runner.temp }}/perf-fixture/fixture-setup.log
            ${{ runner.temp }}/perf-candidate-tests/test-build.json
            ${{ runner.temp }}/perf-candidate-tests/test-build.log
          retention-days: 90
          if-no-files-found: error

  # No owned runner is registered by this change. Enable only after reviewed
  # host inventory, neutral artifact paths, pinned standalone controls and
  # exact formal observations exist. Do not execute PR code on these hosts.
  nightly-reference:
    name: Reference nightly measurement
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PERF_REFERENCE_NIGHTLY_ENABLED == 'true'
    runs-on: [self-hosted, perf-reference-linux]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build exact main candidate and load client
        run: |
          go build -o "${{ runner.temp }}/perf-candidate" ./cmd/gortex
          go build -o "${{ runner.temp }}/perf-load" ./bench/load
          go build -o "${{ runner.temp }}/perf-check-budgets" ./bench/check-budgets
      - name: Collect full standalone matrix and enforce strict budgets
        env:
          PERF_CONFIG: ${{ vars.PERF_REFERENCE_NIGHTLY_CONFIG }}
        run: >-
          "${{ runner.temp }}/perf-check-budgets" collect
          --config "$PERF_CONFIG" --require-lane nightly
          --expected-candidate "${{ github.sha }}"
          --candidate-binary "${{ runner.temp }}/perf-candidate"
          --load-binary "${{ runner.temp }}/perf-load"
          --out "${{ runner.temp }}/perf-evidence-${{ github.run_id }}"
      - name: Preserve failures, raw reports, stop receipts and budget table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/perf-evidence-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error

  nightly-mac:
    name: Apple Silicon nightly measurement (when owned host is available)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PERF_MAC_NIGHTLY_ENABLED == 'true'
    runs-on: [self-hosted, perf-apple-silicon]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build exact main candidate and load client
        run: |
          go build -o "${{ runner.temp }}/perf-candidate" ./cmd/gortex
          go build -o "${{ runner.temp }}/perf-load" ./bench/load
          go build -o "${{ runner.temp }}/perf-check-budgets" ./bench/check-budgets
      - name: Collect full standalone matrix and enforce strict budgets
        env:
          PERF_CONFIG: ${{ vars.PERF_MAC_NIGHTLY_CONFIG }}
        run: >-
          "${{ runner.temp }}/perf-check-budgets" collect
          --config "$PERF_CONFIG" --require-lane nightly
          --expected-candidate "${{ github.sha }}"
          --candidate-binary "${{ runner.temp }}/perf-candidate"
          --load-binary "${{ runner.temp }}/perf-load"
          --out "${{ runner.temp }}/perf-evidence-${{ github.run_id }}"
      - name: Preserve failures, raw reports, stop receipts and budget table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-mac-${{ github.run_id }}
          path: ${{ runner.temp }}/perf-evidence-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error
