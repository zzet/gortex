name: Trusted main performance binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-main-binary-${{ github.sha }}
  cancel-in-progress: false

env:
  CGO_CFLAGS: -O2 -g -fno-strict-aliasing
  CGO_CXXFLAGS: -O2 -g -fno-strict-aliasing
  GOTOOLCHAIN: local

jobs:
  main-linux-arm64:
    # Build-only artifact plumbing needs no reference-capacity claim. Leave
    # disabled until the owner approves extra hosted scheduling. Dispatch is
    # not publishable provenance and is deliberately excluded.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PERF_MAIN_ARTIFACT_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the artifact preparation command
        run: go build -o "${{ runner.temp }}/perf-artifact-writer" ./bench/check-budgets
      - name: Prepare the explicit pinned fixture before compiling benchmark executables
        env:
          # Reviewed contemporary public Gortex fixture; no moving branch input.
          PERF_MICRO_FIXTURE_REVISION: c6c6de19da02fc698db7a89f9922a8ec49cc61b5
        run: >-
          "${{ runner.temp }}/perf-artifact-writer" prepare-fixture
          --revision "$PERF_MICRO_FIXTURE_REVISION"
          --out "${{ runner.temp }}/perf-main-fixture"
      - name: Build the clean exact-main daemon
        run: go build -o "${{ runner.temp }}/perf-main-gortex" ./cmd/gortex
      - name: Build all three clean exact-main test executables
        run: >-
          "${{ runner.temp }}/perf-artifact-writer" prepare-tests
          --source . --revision "${{ github.sha }}"
          --out "${{ runner.temp }}/perf-main-tests"
      - name: Prepare the repository-pinned benchstat tool
        run: >-
          "${{ runner.temp }}/perf-artifact-writer" prepare-benchstat
          --out "${{ runner.temp }}/perf-main-tool"
      - name: Bind binary hash, build settings and exact workflow provenance
        run: >-
          "${{ runner.temp }}/perf-artifact-writer" main-artifact
          --binary "${{ runner.temp }}/perf-main-gortex"
          --out "${{ runner.temp }}/perf-main-bundle"
          --test-binaries "${{ runner.temp }}/perf-main-tests"
          --benchstat-binary "${{ runner.temp }}/perf-main-tool/benchstat"
          --fixture "${{ runner.temp }}/perf-main-fixture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-main-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/perf-main-bundle/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
