name: Windows WAL diagnostic

on:
  push:
    branches: [codex/windows-wal-diagnostics-20261004]

permissions:
  contents: read

jobs:
  two-existing-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record diagnostic source
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain --untracked-files=normal
          go version
      - name: Run two original Windows cases with phase diagnostics
        shell: bash
        run: go test -v -count=1 -timeout=45m -run '^(TestCompletedSlowConvergenceRecoversContinuousWrites|TestSlowConvergenceProofRefusesInvalidCopies)$' ./internal/graph/store_sqlite
